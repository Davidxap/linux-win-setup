# ============================================================================
#  ranger/rc.conf — Daily-driver ranger file manager configuration.
#
#  ranger loads its stock defaults first, so this file only overrides the
#  settings that matter for everyday use:
#    - miller columns + borders for a clear view
#    - previews on (text/archive via ranger's bundled preview script)
#    - git-aware statusline (vcs), relative line numbers
#    - jungle colorscheme, hidden files one keystroke away (zh)
#  Everything else stays stock → safe across ranger upgrades.
#
#  NOTE: ranger's `set` command takes everything after the option name as
#  the value and does NOT strip inline comments. Keep every comment on its
#  own line — an inline "# ..." would become part of the value and make the
#  option invalid (e.g. `set viewmode miller # x` breaks startup).
# ============================================================================

# ── View ────────────────────────────────────────────────────────────────
# Classic multi-column hierarchy.
set viewmode miller
# Narrow parent, wide current dir.
set column_ratios 1,3,4
# Visible separators between columns.
set draw_borders both
set colorscheme jungle
# Relative numbers help with marks/labels.
set line_numbers relative
set show_cursor false

# Start with hidden files hidden but toggleable with 'zh'.
set show_hidden false

# ── Previews ────────────────────────────────────────────────────────────
# Text/archive previews via ranger's bundled preview script (used when
# previewing). preview_script is intentionally NOT set here: ranger falls
# back to its own data/scope.sh, so no file needs to be deployed.
set use_preview_script true
# Image previews inside kitty: install pillow and uncomment the next line.
# set preview_images_method kitty
set preview_images false

# ── Behavior ────────────────────────────────────────────────────────────
set display_free_space_in_status_bar true
set display_size_in_main_column true
# Ask only when deleting several files.
set confirm_on_delete multiple
set automatically_count_files true
set autosave_bookmarks true
# Show git/vcs state in the statusline.
set vcs_aware true
set vcs_backend_git enabled

# ── Keys (stock layout; only small tweaks) ──────────────────────────────
# 'e' already opens the editor — nothing to remap.
# 'zh' toggles hidden files · 'zr' resets the filter · 'dd' deletes.

# ── Tips ────────────────────────────────────────────────────────────────
#   :open_in_kitty  → open the current dir in kitty
#   r               → invoke the default opener (see rifle.conf)
#   S               → open a shell in the current directory