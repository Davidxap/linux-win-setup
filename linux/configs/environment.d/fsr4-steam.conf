# ============================================================================
#  FSR 4 global for Steam (AMD GPUs)
#  Applied to every game running under GE-Proton.
#  Loaded by systemd-environment-d (graphical session) and by the shell.
#  Requires GE-Proton to be selected per-game (ProtonUp-Qt / Steam).
# ============================================================================

# FSR 4: makes VKD3D-Proton fetch and install the FSR4 DLLs and expose them
# to the game (auto-upgrades FSR3.1 -> FSR4 where supported).
PROTON_FSR4_UPGRADE=1

# RADV driver optimizations:
#   gpl = Graphics Pipeline Library (less shader-compile stutter)
#   ngg = NGG primitive shader (RDNA default, explicit for clarity)
RADV_PERFTEST=gpl,ngg

# Native DXR raytracing support
VKD3D_CONFIG=dxr,dxr11
VKD3D_FEATURE_LEVEL=12_2

# Stop Proton from probing the NVIDIA drivers (AMD-only setup)
PROTON_HIDE_NVIDIA_GPU=1