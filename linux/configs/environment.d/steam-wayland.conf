# Desactiva el dialogo de Vulkan Shader Pre-Cache de Steam que se traga en Wayland
# (el popup "Processing/Downloading Vulkan shaders" que congela el lanzamiento)
STEAM_USE_WAYLAND=1
GDK_BACKEND=wayland,x11

# Evita que Steam procese/descargue shaders Vulkan precalculados al lanzar
# (el dialogo de esto es el que se traga en Wayland). El juego compila sus
# propios shaders via radv; el precache de Steam no es necesario.
STEAM_DISABLE_VULKAN_PRECACHE=1
