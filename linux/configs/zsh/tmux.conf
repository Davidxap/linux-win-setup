# ============================================================================
#  .tmux.conf — tmux daily-driver config (Catppuccin Mocha).
#  Mouse on, split with | / -, new window from the current dir, renumbering,
#  and a readable status bar that matches the kitty/fish/starship theme.
# ============================================================================

# ── Behaviour ──────────────────────────────────────────────────────────────
set -g escape-time 0                 # fast key repeat (vim <Esc> sequences)
set -g history-limit 10000
set -g mouse on
set -g base-index 1                  # windows start at 1
setw -g pane-base-index 1            # panes start at 1
set -g renumber-windows on           # keep numbers contiguous after a close
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"   # truecolor

# ── Key bindings ───────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf      # reload config
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind C-c new-session
bind n next-window
bind p previous-window

# ── Status bar (Catppuccin Mocha) ──────────────────────────────────────────
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left  "#[bg=#89b4fa,fg=#1e1e2e,bold] ♯ #S #[bg=#1e1e2e,fg=#89b4fa]"
set -g status-left-length 40
set -g status-right "#[fg=#a6adc8]#(whoami)@#h #[fg=#89b4fa]%H:%M"
setw -g window-status-format         "#[fg=#a6adc8] #I:#W #[fg=#1e1e2e]"
setw -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W #[bg=#1e1e2e,fg=#89b4fa]"

# ── Panes / messages ───────────────────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#1e1e2e,fg=#89b4fa"
set -g message-command-style "bg=#1e1e2e,fg=#a6adc8"
set -g mode-style "bg=#313244,fg=#cdd6f4"
