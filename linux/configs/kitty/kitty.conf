# ============================================================================
#  kitty.conf — Daily-driver kitty configuration (Catppuccin Mocha).
#
#  Why these choices:
#    - GPU-accelerated rendering → smooth scrolling with a large scrollback
#    - `shell fish`            → kitty always opens your fish shell
#    - Mouse like a modern terminal: select=copy, right-click=paste,
#      ctrl+click=open URL
#    - Keyboard mirrors what modern terminals expect (Ctrl+Shift+C/V, tabs)
# ============================================================================

include catppuccin-mocha.conf

# Launch fish by default in every kitty window.
shell fish

# JetBrains Mono Nerd Font (use 'file fonts' family names if fonts differ).
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# Subtle transparency — uncomment if a compositor is running.
background_opacity 0.85

# Beam cursor (like VS Code / good for precision typing).
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

window_padding_width 8

scrollback_lines 10000
scrollback_pager_history_size 100

tab_bar_edge top
tab_bar_style powerline
tab_activity_symbol ✳

confirm_os_window_close 0

mouse_hide_wait 2.0

# Classic-terminal mouse copy/paste:
#   selecting text copies it to the clipboard automatically
copy_on_select clipboard

# Right-click = paste from clipboard (closest thing to a copy/paste menu).
mouse_map right click ungrabbed paste_from_clipboard
# Shift+right-click = extend the current selection.
mouse_map shift+right press ungrabbed mouse_selection extend

# Ctrl + left-click opens links pointed at.
mouse_map ctrl+left click ungrabbed open_url

# Keyboard shortcuts that match modern terminals.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab